name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('apps/desktop/package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2)+'\n')" "$VERSION"
          node -e "console.log('building version', JSON.parse(require('fs').readFileSync('apps/desktop/package.json','utf8')).version)"
        env:
          VERSION: ${{ github.ref_name }}
      - name: Build packages
        run: |
          pnpm -r --filter '!@baize/desktop' run build
          pnpm --filter @baize/desktop run build
      - name: Package and publish draft release
        run: pnpm --filter @baize/desktop exec electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          codesign -dv "release/mac-arm64/BaiZe.app" 2>&1
          codesign --verify "release/mac-arm64/BaiZe.app"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baize-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
