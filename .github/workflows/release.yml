name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Both platform builds upload into ONE draft release. Creating it here first
  # prevents the electron-builder race where each runner drafts its own release
  # for the same tag (one of them ending up with only a blockmap).
  draft-release:
    name: Ensure single draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release for this tag (skip when it exists)
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
          else
            gh release create "$TAG" --draft --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  build:
    name: Build (${{ matrix.os }})
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('apps/desktop/package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2)+'\n')" "$VERSION"
          node -e "console.log('building version', JSON.parse(require('fs').readFileSync('apps/desktop/package.json','utf8')).version)"
        env:
          VERSION: ${{ github.ref_name }}
      - name: Build packages
        run: |
          pnpm -r --filter '!@baize/desktop' run build
          pnpm --filter @baize/desktop run build
      # Publishing is done exclusively via gh release upload below; letting
      # electron-builder publish would race across the two platform jobs.
      - name: Package (no publish)
        run: pnpm --filter @baize/desktop exec electron-builder ${{ matrix.args }} --publish never
      - name: Verify ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          codesign -dv "release/mac-arm64/BaiZe.app" 2>&1
          codesign --verify "release/mac-arm64/BaiZe.app"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baize-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
      # Idempotent re-upload: electron-builder's own publish step can be cut
      # short when the job ends while a large file is still uploading.
      - name: Ensure draft release assets
        working-directory: apps/desktop
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.blockmap release/latest*.yml)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
