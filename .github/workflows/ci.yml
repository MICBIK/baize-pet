name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test (ubuntu)
    runs-on: ubuntu-latest
    env:
      # Unit tests never launch Electron, so skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: Check SPDX headers
        run: pnpm spdx:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

  smoke:
    name: Smoke (production build, ubuntu + xvfb)
    runs-on: ubuntu-latest
    # Deliberately no ELECTRON_SKIP_BINARY_DOWNLOAD here: the smoke suite boots
    # the real Electron binary against the production build (ADR 0006).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build
      # safeStorage (key encryption) requires a usable secret backend on Linux;
      # run everything inside a dbus session with a throwaway unlocked
      # gnome-keyring that exposes org.freedesktop.secrets. Electron dlopens
      # libsecret-1.so.0 for the gnome backend and silently falls back to
      # basic_text when it is missing (minimal runner images lack it).
      - name: E2E smoke against out/ (dbus + keyring session)
        run: |
          if ! command -v gnome-keyring-daemon >/dev/null || ! ldconfig -p | grep -q libsecret-1.so.0; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus-x11 libsecret-1-0
          fi
          ldconfig -p | grep libsecret-1.so.0 || { echo "libsecret missing" >&2; exit 1; }
          dbus-run-session -- bash -c '
            set -e
            # Export the daemon environment (GNOME_KEYRING_CONTROL) so the
            # unlock invocation below reaches THIS daemon instead of spawning
            # a second one that never talks to the session bus.
            eval "$(gnome-keyring-daemon --start --components=secrets 2>/dev/null)"
            echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL"
            echo -n "baize-ci-keyring" | gnome-keyring-daemon --unlock 2>&1 | sed "s/^/unlock: /"
            for _ in 1 2 3 4 5; do
              sleep 1
              if gdbus call --session --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.ListNames | grep -q org.freedesktop.secrets; then
                echo "org.freedesktop.secrets is on the bus"
                break
              fi
            done
            gdbus call --session --dest org.freedesktop.DBus \
              --object-path /org/freedesktop/DBus \
              --method org.freedesktop.DBus.ListNames | grep -q org.freedesktop.secrets \
              || { echo "org.freedesktop.secrets not on the bus" >&2; exit 1; }
            gdbus call --session --dest org.freedesktop.secrets \
              --object-path /org/freedesktop/secrets/collection/login \
              --method org.freedesktop.DBus.Properties.Get \
              org.freedesktop.Secret.Collection Locked 2>&1 | sed "s/^/login-collection: /" || true
            xvfb-run -a pnpm test:smoke
          '
      - name: Collect debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: /tmp/baize-smoke-*
          if-no-files-found: ignore
