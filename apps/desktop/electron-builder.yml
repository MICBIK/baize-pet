appId: com.baizepet.desktop
productName: BaiZe
directories:
  output: release
files:
  - out/**
  - "!**/.DS_Store"
asar: true
afterPack: build/after-pack.cjs
extraResources:
  - from: ../../characters
    to: characters
  - from: ../../assets
    to: assets
mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch:
        - arm64
win:
  target:
    - nsis
